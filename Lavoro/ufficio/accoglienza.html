<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accoglienza</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: radial-gradient(circle at 50% 35%, #fbf8f2 0%, #f3ece0 100%);
    color: #2a2a2a;
    font-family: Inter, Helvetica, Arial, sans-serif;
  }
  .logo {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 45px;
    display: block;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .manifesto {
    text-align: center;
    padding: 100px 20px 40px;
  }
  .immagine {
    width: clamp(150px, 28vw, 230px);
    height: auto;
    margin: 0 auto 44px;
    display: block;
    animation: respiro 5s ease-in-out infinite;
  }
  @keyframes respiro {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .luce { animation: pulsa 4s ease-in-out infinite; transform-origin: 50% 50%; }
  @keyframes pulsa {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; }
  }
  .titolo {
    font-size: clamp(2.2rem, 10vw, 6.5rem);
    font-weight: 200;
    letter-spacing: 0.2em;
    padding-left: 0.2em;
    line-height: 1;
    color: #222;
  }
  .decoro {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 40px;
  }
  .decoro span {
    display: block;
    width: 48px;
    height: 1px;
    background: #b8a98f;
  }
  .decoro i {
    display: block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #e8b45c;
  }
</style>
</head>
<body>
  <!-- Logo in alto (90x45) -->
  <svg class="logo" viewBox="0 0 1024 608" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CGIL">
    <rect width="1024" height="608" fill="#ce1129"/>
    <polygon points="0,0 110,0 0,105" fill="#009246"/>
    <polygon points="110,0 197,0 0,212 0,105" fill="#ffffff"/>
    <text x="205" y="387" fill="#ffffff" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="270" textLength="630" lengthAdjust="spacingAndGlyphs">CGIL</text>
  </svg>

  <div class="manifesto">
    <svg class="immagine" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="alone" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f8d58f" stop-opacity="0.75"/>
          <stop offset="100%" stop-color="#f8d58f" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="raggio" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f5c76b" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#f5c76b" stop-opacity="0.15"/>
        </linearGradient>
      </defs>

      <circle class="luce" cx="100" cy="100" r="95" fill="url(#alone)"/>
      <circle cx="100" cy="100" r="86" fill="none" stroke="#c9b997" stroke-width="1"/>
      <path class="luce" d="M86 142 L70 176 L130 176 L114 142 Z" fill="url(#raggio)"/>

      <g fill="none" stroke="#2a2a2a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M52 92 L100 52 L148 92"/>
        <path d="M62 84 V142 H138 V84"/>
      </g>

      <rect x="86" y="100" width="28" height="42" fill="#f5c76b"/>
      <path d="M86 100 L70 106 V146 L86 142 Z" fill="#e9dfcc" stroke="#2a2a2a" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M86 100 H114 V142" fill="none" stroke="#2a2a2a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M44 142 H156" stroke="#2a2a2a" stroke-width="2.5" stroke-linecap="round"/>

      <path d="M100 38 C94 30 84 34 87 42 C89 47 96 51 100 55 C104 51 111 47 113 42 C116 34 106 30 100 38 Z" fill="#e8b45c" transform="translate(0,-8)"/>

      <circle cx="38" cy="70" r="2.5" fill="#e8b45c"/>
      <circle cx="164" cy="64" r="2" fill="#c9b997"/>
      <circle cx="30" cy="120" r="2" fill="#c9b997"/>
      <circle cx="172" cy="118" r="2.5" fill="#e8b45c"/>
    </svg>

    <p class="titolo">ACCOGLIENZA</p>

    <div class="decoro">
      <span></span><i></i><span></span>
    </div>
  </div>
</body>
</html>
